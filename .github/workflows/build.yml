name: Build et publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_BUILD: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Calculer le numéro de version
        run: |
          # package.json donne la base (ex. 0.1.0-beta) ; le dernier chiffre est le numéro de compilation.
          BASE=$(node -p "require('./package.json').version.split('-')[0].split('.').slice(0,2).join('.')")
          CHANNEL=$(node -p "(require('./package.json').version.split('-')[1] || '')")
          V="${BASE}.${{ github.run_number }}"
          if [ -n "$CHANNEL" ]; then V="${V}-${CHANNEL}"; fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APK_NAME=P-Flow-$V.apk" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$([ -n "$CHANNEL" ] && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Construire la version web
        run: npm run build

      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Construire l'APK Android
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "../${APK_NAME}"

      - name: Publier l'APK
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: P-Flow ${{ env.APP_VERSION }}
          body: |
            Page de téléchargement : https://lorn-noross.github.io/P-Flow/telecharger.html
          files: ${{ env.APK_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}

      - name: Annoncer la nouvelle version à l'appli
        if: env.HAS_KEY == 'true'
        run: |
          echo "{\"version\":\"${APP_VERSION}\",\"build\":${APP_BUILD},\"apk\":\"https://github.com/${{ github.repository }}/releases/download/v${APP_VERSION}/${APK_NAME}\"}" > dist/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
