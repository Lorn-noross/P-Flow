name: Nettoyer les étiquettes orphelines

# Supprime les étiquettes (tags) qui n'ont plus de version publiée associée,
# par exemple après la suppression d'une version dans « Releases ».
# Aucune version publiée n'est supprimée.
# Se lance à la main (Actions → Run workflow) et une fois quand ce fichier change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nettoyage.yml']

permissions:
  contents: write

jobs:
  nettoyage:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les étiquettes sans version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName')
          gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' | while read -r t; do
            if echo "$RELEASES" | grep -qx "$t"; then
              echo "Conservée : $t"
            else
              echo "Suppression de l'étiquette $t"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t"
            fi
          done
