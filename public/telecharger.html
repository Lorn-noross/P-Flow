<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Télécharger P-Flow</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#F1F4F6;--ink:#14202B;--muted:#5A6875;--accent:#2453C4;--card:#fff;--line:#D9E0E6}
  @media (prefers-color-scheme:dark){:root{--bg:#0E1318;--ink:#E4EAF0;--muted:#95A3B0;--accent:#7DA3FF;--card:#161D24;--line:#29333D;color-scheme:dark}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
  main{max-width:420px;width:100%;display:grid;gap:16px}
  img{width:64px;height:64px;border-radius:18px}
  h1{margin:0;font-size:30px;letter-spacing:-.02em}
  p{margin:0;color:var(--muted)}
  a.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:650;padding:14px;border-radius:12px}
  ol{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:6px}
</style>
</head>
<body>
<main>
  <img src="./icon-192.png" alt="">
  <h1>P-Flow</h1>
  <p id="v">Recherche de la dernière version…</p>
  <a class="btn" id="dl" href="#" hidden>Télécharger pour Android</a>
  <ol>
    <li>Ouvre le fichier téléchargé.</li>
    <li>Si Android bloque : Paramètres → « Autoriser cette source », puis reviens.</li>
    <li>Touche Installer.</li>
  </ol>
  <p>Sur iPhone ou PC, utilise plutôt <a href="./">la version web</a>.</p>
</main>
<script>
fetch('./version.json', { cache: 'no-store' }).then(r => r.json()).then(v => {
  const label = String(v.version).replace(/-beta/, ' bêta');
  document.getElementById('v').textContent = 'Dernière version : ' + label;
  const a = document.getElementById('dl'); a.href = v.apk; a.hidden = false;
  a.textContent = 'Télécharger P-Flow ' + label;
}).catch(() => { document.getElementById('v').textContent = 'Impossible de trouver la dernière version. Réessaie dans quelques minutes.'; });
</script>
</body>
</html>
